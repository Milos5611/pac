name: client

on:
  push:
    branches: [master]
    paths: ['client/**', '.github/workflows/client_workflow.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/client_workflow.yml']
  workflow_dispatch:

jobs:
  build:
    name: check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  publish:
    name: build and publish image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN pushes to GitHub Container Registry; no registry secrets needed
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: latest (default branch only) and sha-<short commit>; also adds
      # the OCI source label that links the package to this repository
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pac-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
