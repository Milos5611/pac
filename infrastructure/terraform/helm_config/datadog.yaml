datadog:
  site: "datadoghq.eu"
  clusterName: "pac-minikube"
  apiKeyExistingSecret: "datadog"
  appKeyExistingSecret: "datadog"
  collectEvents: true
  # Minikube's kubelet serves a self-signed certificate.
  kubelet:
    tlsVerify: false
  clusterChecks:
    enabled: true
  processAgent:
    enabled: true
    processCollection: true
  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true
  orchestratorExplorer:
    enabled: true
  apm:
    portEnabled: true
  nodeLabelsAsTags:
    node.kubernetes.io/instance-type: instance_type
    topology.kubernetes.io/region: region
    topology.kubernetes.io/zone: zone
  podLabelsAsTags:
    app.kubernetes.io/name: kube_app
    helm.sh/chart: helm_chart
    app.kubernetes.io/instance: helm_release

clusterAgent:
  enabled: true
  metricsProvider:
    enabled: true
